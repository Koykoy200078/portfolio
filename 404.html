<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Redirecting...</title>
		<script>
			// Single-Page App redirect for GitHub Pages with a custom domain.
			// Encodes the current path into a query string and sends the browser
			// back to the root so index.html (and React) can handle routing.
			// This avoids the infinite /portfolio/portfolio/portfolio... loop that
			// occurs when the script naively prepends a sub-path to every 404.
			var l = window.location
			var segmentCount = 0 // 0 = custom domain at root, 1 = project page

			// Only redirect if not already at root to prevent any edge-case loops.
			if (l.pathname !== '/') {
				l.replace(
					l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + '?/' + l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash,
				)
			}
		</script>
	</head>
	<body>
		<p>Redirecting&hellip;</p>
	</body>
</html>
